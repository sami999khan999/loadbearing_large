name: ratchet

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ratchet
      POSTGRES_PASSWORD: ratchet
      POSTGRES_DB: ratchet
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres.init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratchet -d ratchet"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_CACHE_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["${REDIS_QUEUE_PORT:-6380}:6379"]
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # MinIO withdrew the community images from Docker Hub and Quay in October 2025, so
    # `minio/minio` no longer resolves. This is a rebuild of that final release.
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ratchet
      MINIO_ROOT_PASSWORD: ratchetsecret
    ports: ["${S3_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      # The HTTP probe, not `mc ready local`: `mc` is not in the server image, and the
      # `local` alias it names is created in `minio-init` below. That check could only
      # ever fail, so `depends_on: service_healthy` never released.
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # `mc` went with the server image. Bitnami's archive still carries the binary, and
    # the entrypoint below is ours, so only `mc` being on PATH matters.
    image: bitnamilegacy/minio-client:latest
    # One-shot: it creates buckets and exits 0. Without this the default policy keeps
    # restarting a container whose whole job is to finish.
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # `mc alias set` writes config under $HOME, which is not writable in every image.
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ratchet ratchetsecret &&
      mc mb --ignore-existing local/ratchet &&
      mc mb --ignore-existing local/loki &&
      mc anonymous set none local/ratchet &&
      mc anonymous set none local/loki &&
      echo 'buckets ready'
      "

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["${LOKI_PORT:-3100}:3100"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./loki.config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 3s
      retries: 20

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports: ["${ALLOY_PORT:-12345}:12345"]
    depends_on:
      loki:
        condition: service_healthy
    # The socket below is root:docker on Linux and Alloy does not run as root, so
    # without the group it collects nothing and says nothing about why.
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - ./alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/var/log/app:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/12345"]
      interval: 10s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    profiles: ["analytics"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ratchet
      CLICKHOUSE_PASSWORD: ratchet
      CLICKHOUSE_DB: ratchet
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      [
        "${CLICKHOUSE_HTTP_PORT:-8123}:8123",
        "${CLICKHOUSE_NATIVE_PORT:-9002}:9000",
      ]
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - ./clickhouse.init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisqueuedata:
  miniodata:
  lokidata:
  clickhousedata:
