apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Follow a traceId from a log line into whatever traces you add later.
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([^"]+)"'
          url: '$${__value.raw}'

  - name: Postgres
    type: grafana-postgresql-datasource
    uid: postgres
    access: proxy
    url: postgres:5432
    user: ratchet
    jsonData:
      database: ratchet
      sslmode: disable
    secureJsonData:
      password: ratchet
