packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

catalog:
  # ── language & build ──
  typescript: ^5.9.3
  tsup: ^8.5.0
  tsx: ^4.19.0
  rimraf: ^6.1.3
  vitest: ^3.1.4
  "@types/node": ^24.3.0

  # ── lint & format ──
  eslint: ^9.27.0
  typescript-eslint: ^8.32.1
  "@eslint/js": ^9.27.0
  prettier: ^3.9.6

  # ── contracts ──
  zod: ^4.0.14

  # ── oRPC — pin all four together ──
  "@orpc/contract": ^1.13.7
  "@orpc/server": ^1.13.7
  "@orpc/client": ^1.13.7
  "@orpc/tanstack-query": ^1.13.7

  # ── data & infrastructure ──
  "drizzle-orm": ^0.44.0
  "drizzle-kit": ^0.31.0
  pg: ^8.13.0
  "@types/pg": ^8.11.10
  ioredis: ^5.4.2
  bullmq: ^5.34.0
  "@aws-sdk/client-s3": ^3.700.0
  "@aws-sdk/s3-request-presigner": ^3.700.0

  # ── auth ──
  "better-auth": ^1.3.26

catalogs:
  react:
    react: ^19.1.0
    react-dom: ^19.1.0
    "@types/react": ^19.1.4
    "@types/react-dom": ^19.1.5

# ── resolution & safety ──
engineStrict: true
linkWorkspacePackages: deep
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling
strictPeerDependencies: false

# ── which dependencies may run install scripts ──
allowBuilds:
  esbuild: true
  sharp: true
  better-sqlite3: true
  electron: true
