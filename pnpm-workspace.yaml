packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

catalog:
  # ── language & build ──
  typescript: ^5.8.3
  tsup: ^8.5.0
  tsx: ^4.19.0
  rimraf: ^6.0.1
  vitest: ^3.1.4
  "@types/node": ^24.3.0

  # ── lint & format ──
  "@biomejs/biome": ^2.4.15
  eslint: ^9.27.0
  typescript-eslint: ^8.32.1
  sherif: ^1.13.0
  syncpack: ^15.3.2

  # ── contracts ──
  zod: ^4.4.3

  # ── oRPC — pin all four together ──
  "@orpc/contract": ^1.15.0
  "@orpc/server": ^1.13.7
  "@orpc/client": ^1.15.0
  "@orpc/tanstack-query": ^1.15.0

  # ── TanStack Query — peer of @orpc/tanstack-query, which needs query-core >=5.80.2 ──
  "@tanstack/react-query": ^5.101.4

  # ── TanStack Router ──
  "@tanstack/react-router": ^1.135.0

  # ── Tauri ──
  "@tauri-apps/api": ^2.9.0
  "@tauri-apps/cli": ^2.9.0

  # ── data & infrastructure ──
  "drizzle-orm": ^0.44.7
  "drizzle-kit": ^0.31.0
  pg: ^8.23.0
  "@types/pg": ^8.11.10
  ioredis: ^5.11.1
  bullmq: ^5.81.3
  "@aws-sdk/client-s3": ^3.1107.0
  "@aws-sdk/s3-request-presigner": ^3.1107.0

  # ── auth ──
  "better-auth": ^1.6.26

catalogs:
  react:
    react: ^19.1.0
    react-dom: ^19.1.0
    "@types/react": ^19.1.4
    "@types/react-dom": ^19.1.5

# ── resolution & safety ──
engineStrict: true
linkWorkspacePackages: deep
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling
strictPeerDependencies: false

# ── which dependencies may run install scripts ──
allowBuilds:
  esbuild: true
  # Optional native accelerator for msgpackr, pulled in transitively by bullmq.
  # Denied: msgpackr falls back to pure JS and round-trips correctly without it.
  msgpackr-extract: false
  sharp: true
